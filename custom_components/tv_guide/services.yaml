save_bookmark:
  name: Save programme
  description: Save a TV programme to the native TV Guide bookmark list.
  fields:
    id:
      required: true
      example: "ard-202610132015"
      selector:
        text:
    title:
      required: true
      selector:
        text:
    channel:
      required: true
      selector:
        text:
    channel_id:
      required: true
      selector:
        text:
    start:
      required: true
      selector:
        text:
    end:
      required: true
      selector:
        text:
save_reminder:
  name: Save reminder
  description: Store a programme reminder for delivery through the configured Home Assistant notification service.
  fields:
    id:
      required: true
      selector:
        text:
    title:
      required: true
      selector:
        text:
    channel:
      required: true
      selector:
        text:
    channel_id:
      required: true
      selector:
        text:
    start:
      required: true
      selector:
        text:
    end:
      required: true
      selector:
        text:
    minutes:
      required: false
      default: 10
      selector:
        select:
          options:
            - "5"
            - "10"
            - "15"
            - "30"
remove_saved_programme:
  name: Remove saved programme
  description: Remove an item from the native TV Guide bookmark or reminder list.
  fields:
    id:
      required: true
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          options:
            - bookmark
            - reminder
            - programme
get_programmes:
  name: Get TV programmes
  description: Return cached XMLTV programmes for a timezone-aware interval, without downloading the feed.
  fields:
    channel_id:
      example: ard
      selector:
        text:
    start:
      required: true
      example: "2026-10-13T19:00:00+02:00"
      selector:
        text:
    end:
      required: true
      example: "2026-10-13T22:00:00+02:00"
      selector:
        text:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box

get_channels:
  name: Get TV channels
  description: Return the original country channel catalogue together with additional channels from the cached EPG feed, including availability and saved selection.

set_channels:
  name: Set selected TV channels
  description: Save an ordered list of canonical or XMLTV channel IDs. An empty list means all channels.
  fields:
    channels:
      required: true
      example:
        - ard
        - zdf
      selector:
        object:

get_saved_programmes:
  name: Get saved TV programmes
  description: Return active native bookmarks and reminders, including sent status.

get_native_guide:
  name: Get native TV Guide view
  description: Return seven programme rows per displayed sender in the original TV Guide presentation model.
  fields:
    at:
      selector:
        text:
get_native_channels:
  name: Get native personal channel picker
  description: Return current-feed sender choices and saved ordering for the native card.
get_ui_settings:
  name: Get native TV Guide display settings
  description: Return persisted native display and notification settings.
set_ui_settings:
  name: Set native TV Guide display settings
  description: Validate and persist native card display options and notification destination.
  fields:
    options:
      required: true
      selector:
        object:
native_request:
  name: Original TV Guide operation
  description: Authenticated in-process operations for the original multi-provider guide engine.
  fields:
    endpoint:
      required: true
      selector:
        text:
    method:
      selector:
        select:
          options: [GET, POST]
    body:
      selector:
        object:
