save_bookmark:
  name: Save programme
  description: Save a TV programme to the TV Guide bookmark list.
  fields:
    id:
      required: true
      example: "ard-202610132015"
      selector:
        text:
    title:
      required: true
      selector:
        text:
    channel:
      required: true
      selector:
        text:
    channel_id:
      required: true
      selector:
        text:
    start:
      required: true
      selector:
        text:
    end:
      required: true
      selector:
        text:
save_reminder:
  name: Save reminder
  description: Store a programme reminder for delivery through the configured Home Assistant notification service.
  fields:
    id:
      required: true
      selector:
        text:
    title:
      required: true
      selector:
        text:
    channel:
      required: true
      selector:
        text:
    channel_id:
      required: true
      selector:
        text:
    start:
      required: true
      selector:
        text:
    end:
      required: true
      selector:
        text:
    minutes:
      required: false
      default: 10
      selector:
        select:
          options:
            - "5"
            - "10"
            - "15"
            - "30"
remove_saved_programme:
  name: Remove saved programme
  description: Remove an item from the TV Guide bookmark or reminder list.
  fields:
    id:
      required: true
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          options:
            - bookmark
            - reminder
            - programme
get_programmes:
  name: Get TV programmes
  description: Return cached XMLTV programmes for a timezone-aware interval, without downloading the feed.
  fields:
    channel_id:
      example: ard
      selector:
        text:
    start:
      required: true
      example: "2026-10-13T19:00:00+02:00"
      selector:
        text:
    end:
      required: true
      example: "2026-10-13T22:00:00+02:00"
      selector:
        text:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box

get_channels:
  name: Get TV channels
  description: Return the original country channel catalogue together with additional channels from the cached EPG feed, including availability and saved selection.

set_channels:
  name: Set selected TV channels
  description: Save an ordered list of active-country canonical or XMLTV channel IDs for the calendar and TV Guide programme queries. An empty list means all channels.
  fields:
    channels:
      required: true
      example:
        - ard
        - zdf
      selector:
        object:

get_saved_programmes:
  name: Get saved TV programmes
  description: Return active TV Guide bookmarks and reminders, including sent status.

get_preparation_status:
  name: Get TV Guide preparation progress
  description: Return initial programme and verified logo download progress.
retry_preparation:
  name: Retry TV Guide preparation
  description: Resume missing logo packages and retry programme downloads.
get_guide:
  name: Get TV Guide view
  description: Return the TV Guide presentation model. An optional timestamp limits each sender to seven overlapping or upcoming programmes.
  fields:
    at:
      description: Optional ISO timestamp including its timezone.
      selector:
        text:
get_personal_channels:
  name: Get TV Guide personal channel picker
  description: Return current-feed sender choices and saved ordering for the TV Guide card.
get_ui_settings:
  name: Get TV Guide display settings
  description: Return persisted TV Guide display and notification settings.
set_ui_settings:
  name: Set TV Guide display settings
  description: Validate and persist TV Guide card display options and notification destination.
  fields:
    options:
      required: true
      selector:
        object:
guide_request:
  name: TV Guide operation
  description: Authenticated in-process operations for the TV Guide programme provider.
  fields:
    endpoint:
      required: true
      selector:
        text:
    method:
      selector:
        select:
          options: [GET, POST]
    body:
      selector:
        object:
