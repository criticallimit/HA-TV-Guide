name: Validate integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ha-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test authenticated actions, countries, reminders and lifecycle in real Home Assistant
        run: docker run --rm -v "$PWD:/repo:ro" --entrypoint python ghcr.io/home-assistant/home-assistant:stable /repo/tests/ha_smoke.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify published logo update descriptor
        run: python tools/build_logo_updates.py --check
      - name: Check Python syntax
        run: python -m compileall -q custom_components
      - name: Check JSON validity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify scoped view bundle
        run: python tools/build_frontend_view.py --check
      - name: Check TV Guide card syntax
        run: node --check custom_components/tv_guide/frontend/tv-guide-card.js
      - name: Verify and stage pinned read-only reference frontend
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          source = Path("custom_components/tv_guide/frontend/app")
          fixture = Path("tests/reference-frontend")
          reference = json.loads((source / "REFERENCE.json").read_text(encoding="utf-8"))
          assert reference["repository"] == "criticallimit/TV-Guide"
          assert reference["commit"] == "7871c4af8951c1f05ed012d028786181b1974b11"
          # Git blob object IDs taken directly from the pinned original commit.
          import subprocess
          original_blobs = {
              "index.html": "f4538c6afd893be51782b1bd74bf9492f93c7afe",
              "styles.css": "782f7e4e78296cbf58676bf96d46d97fb4af395a",
              "guide-core.js": "51e96a574f4ef168efbe78dd6a7856084273aa69",
              "channel-picker.js": "171605c74c0ab97bf05bd88c303a81478f755f0e",
              "translations.js": "2a8da2d3eb1554d300d145798effbed5443590c6",
              "i18n.js": "b85a2d39aff934dd37b500715ed9aa19d2b4813c",
              "app.js": "ec043728056ab7e0252b0f553bfc4a66eb6343ca",
          }
          assert set(original_blobs) == set(reference["source_sha256"])
          for name, expected in original_blobs.items():
              actual = subprocess.check_output(["git", "hash-object", str(fixture / name)], text=True).strip()
              if actual != expected:
                  raise SystemExit(f"Pinned original frontend fixture changed: {name}")
              if hashlib.sha256((fixture / name).read_bytes()).hexdigest() != reference["source_sha256"][name]:
                  raise SystemExit(f"Original frontend SHA-256 mismatch: {name}")
          target = Path("reference-addon/tv-guide/www")
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, target)
          for name in reference["source_sha256"]:
              shutil.copy2(fixture / name, target / name)
          shutil.copytree(Path("tests/reference-data"), target.parent / "data")
          print("Pinned original frontend verified and staged for pixel comparison")
          PY
      - name: Compare native card with original frontend in Chromium
        env:
          TVG_REFERENCE: reference-addon
        run: node tests/frontend-card.cjs

      - name: Verify native card stability in Chromium
        run: |
          node tests/frontend-stability.cjs
          node tests/frontend-ux.cjs

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Verify repeated opening, resource cleanup and stable theme updates
        env:
          TVG_ENGINE: webkit
        run: |
          node tests/frontend-stability.cjs
          node tests/frontend-ux.cjs
