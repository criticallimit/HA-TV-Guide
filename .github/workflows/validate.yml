name: Validate integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ha-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test setup, actions, reload and unload in real Home Assistant
        run: docker run --rm -v "$PWD:/repo:ro" --entrypoint python ghcr.io/home-assistant/home-assistant:stable /repo/tests/ha_smoke.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q custom_components
      - name: Check JSON validity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in list(Path("custom_components").rglob("*.json")) + [Path("hacs.json")]:
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check native card syntax
        run: node --check custom_components/tv_guide/frontend/tv-guide-native-card.js
      - name: Check out read-only reference frontend
        uses: actions/checkout@v4
        with:
          repository: criticallimit/TV-Guide
          ref: 7871c4af8951c1f05ed012d028786181b1974b11
          path: reference-addon
      - name: Compare native card with original frontend in Chromium
        env:
          TVG_REFERENCE: reference-addon
        run: node tests/frontend-card.cjs
