name: Validate integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ha-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test setup, actions, reload and unload in real Home Assistant
        run: docker run --rm -v "$PWD:/repo:ro" --entrypoint python ghcr.io/home-assistant/home-assistant:stable /repo/tests/ha_smoke.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q custom_components
      - name: Check JSON validity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check native card syntax
        run: node --check custom_components/tv_guide/frontend/tv-guide-native-card.js
      - name: Verify and stage pinned read-only reference frontend
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          source = Path("custom_components/tv_guide/frontend/app")
          reference = json.loads((source / "REFERENCE.json").read_text(encoding="utf-8"))
          assert reference["repository"] == "criticallimit/TV-Guide"
          assert reference["commit"] == "7871c4af8951c1f05ed012d028786181b1974b11"
          for name, expected in reference["source_sha256"].items():
              actual = hashlib.sha256((source / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Original frontend reference changed: {name}")
          target = Path("reference-addon/tv-guide/www")
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, target)
          print("Pinned original frontend verified and staged for pixel comparison")
          PY
      - name: Compare native card with original frontend in Chromium
        env:
          TVG_REFERENCE: reference-addon
        run: node tests/frontend-card.cjs
