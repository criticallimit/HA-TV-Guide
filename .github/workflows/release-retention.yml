name: Retain latest five stable releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without deleting releases
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: stable-release-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep five stable releases without deleting tags
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const prune = require('./.github/scripts/prune-releases.cjs');
            await prune({github, context, core, dryRun:process.env.DRY_RUN === 'true'});
